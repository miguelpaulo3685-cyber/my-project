
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Estudos - ENEM</title>
    <style>
        :root {
            --bg-principal: #121212;
            --bg-card: #1e1e1e;
            --cor-texto: #e0d0c0;
            --cor-destaque: #d4b28c;
            --cor-borda: #333333;
            --cor-acerto: #4caf50;
            --cor-erro: #f44336;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-principal); 
            margin: 0; 
            padding: 0; 
            color: var(--cor-texto); 
            padding-bottom: 70px;
        }

        .container { max-width: 650px; margin: 30px auto; padding: 0 15px; }

        .aba-conteudo { display: none; }
        .aba-conteudo.ativa { display: block; }

        .card-base {
            background: var(--bg-card);
            border: 1px solid var(--cor-borda);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        /* Perfil Header */
        .perfil-header { display: flex; align-items: center; gap: 25px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 25px; }
        .avatar-container { position: relative; cursor: pointer; }
        .avatar { 
            width: 90px; height: 90px; background: var(--cor-destaque); color: #121212;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 38px; font-weight: bold; overflow: hidden; background-size: cover; background-position: center;
        }
        .avatar-overlay {
            position: absolute; bottom: 0; right: 0; background: var(--cor-destaque); color: #121212;
            border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; border: 2px solid var(--bg-card);
        }
        .info-usuario h2 { margin: 0 0 8px 0; font-size: 22px; color: var(--cor-destaque); }
        .stats { display: flex; gap: 20px; font-size: 14px; opacity: 0.85; }
        .stats span { font-weight: bold; color: var(--cor-destaque); }

        .bio { margin-top: 20px; font-size: 14px; line-height: 1.6; }
        .bio p { margin: 5px 0; }

        .edit-input {
            width: 100%; background: #121212; border: 1px solid var(--cor-destaque);
            border-radius: 6px; color: var(--cor-texto); padding: 8px; font-size: 14px; margin-bottom: 8px; box-sizing: border-box; outline: none;
        }
        .escondido { display: none !important; }

        .btn-acao { 
            width: 100%; background-color: transparent; border: 1px solid var(--cor-destaque); color: var(--cor-destaque);
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 14px; transition: all 0.3s ease; 
        }
        .btn-acao:hover { background-color: var(--cor-destaque); color: #121212; }

        /* Feed Posts */
        .criar-post textarea { width: 100%; background: #121212; border: 1px solid var(--cor-borda); border-radius: 8px; color: var(--cor-texto); padding: 12px; font-size: 14px; resize: none; box-sizing: border-box; outline: none; }
        .btn-postar { background-color: var(--cor-destaque); color: #121212; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; margin-top: 10px; }
        .limpar { clear: both; }

        .post-card { background: var(--bg-card); border: 1px solid var(--cor-borda); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; background: var(--cor-destaque); color: #121212; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; background-position: center; flex-shrink: 0; }
        .post-autor h4 { margin: 0; font-size: 15px; color: var(--cor-destaque); }
        .post-autor span { font-size: 12px; opacity: 0.6; }
        .post-conteudo { font-size: 14px; line-height: 1.6; margin-bottom: 15px; white-space: pre-wrap; }
        .post-acoes { display: flex; gap: 20px; font-size: 13px; opacity: 0.8; border-top: 1px solid var(--cor-borda); padding-top: 12px; cursor: pointer; }
        .post-acoes span:hover { color: var(--cor-destaque); }

        /* Simulados */
        .topo-simulado { display: flex; justify-content: space-between; align-items: center; background: #242424; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--cor-borda); }
        .cronometro { font-size: 18px; font-weight: bold; color: var(--cor-destaque); font-family: monospace; }
        .enunciado { font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .badge-dificuldade { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; background: #1b5e20; color: #a5d6a7; }

        .alternativas { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .alternativa-btn { background: #222; border: 1px solid var(--cor-borda); color: var(--cor-texto); padding: 12px 15px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 14px; }
        .alternativa-btn:hover:not(:disabled) { border-color: var(--cor-destaque); background: #2a2a2a; }
        .alternativa-btn.correta { background: rgba(76, 175, 80, 0.2); border-color: var(--cor-acerto); color: #a5d6a7; }
        .alternativa-btn.errada { background: rgba(244, 67, 54, 0.2); border-color: var(--cor-erro); color: #ef9a9a; }

        .painel-resultado { text-align: center; padding: 20px; }
        .painel-resultado h3 { color: var(--cor-destaque); font-size: 24px; margin-bottom: 10px; }
        .metricas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .metrica-card { background: #242424; padding: 15px; border-radius: 10px; border: 1px solid var(--cor-borda); }
        .metrica-card span { display: block; font-size: 22px; font-weight: bold; color: var(--cor-destaque); margin-top: 5px; }

        /* Barra de Navegação */
        .barra-inferior { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--cor-borda); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { color: var(--cor-texto); text-decoration: none; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.7; cursor: pointer; }
        .nav-item.ativo { opacity: 1; color: var(--cor-destaque); }
        .nav-item span.icone { font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">

        <!-- ABA 1: FEED -->
        <div id="aba-feed" class="aba-conteudo ativa">
            <div class="card-base criar-post">
                <textarea id="textoPost" rows="3" placeholder="Compartilhe sua evolução de hoje..."></textarea>
                <button class="btn-postar" onclick="criarPost()">Publicar</button>
                <div class="limpar"></div>
            </div>
            <div id="feedContainer"></div>
        </div>

        <!-- ABA 2: SIMULADOS ENEM -->
        <div id="aba-questoes" class="aba-conteudo">
            <div class="card-base" id="menu-simulado">
                <h2 style="color: var(--cor-destaque); margin-top: 0;">Simulado ENEM - Modelagem TRI</h2>
                <p>Escolha um simulado para iniciar:</p>
                <button class="btn-acao" onclick="iniciarSimulado('matematica')">📐 Simulado de Matemática (3 Questões)</button>
            </div>

            <div class="card-base escondido" id="area-prova">
                <div class="topo-simulado">
                    <span id="progresso-questoes">Questão 1 de 3</span>
                    <div class="cronometro" id="relogio">05:00</div>
                </div>
                <div id="container-questao"></div>
            </div>

            <div class="card-base escondido" id="area-resultado">
                <div class="painel-resultado">
                    <h3>Simulado Concluído! 🎯</h3>
                    <div class="metricas-grid">
                        <div class="metrica-card">Acertos <span id="res-acertos" style="color: var(--cor-acerto);">0</span></div>
                        <div class="metrica-card">Erros <span id="res-erros" style="color: var(--cor-erro);">0</span></div>
                        <div class="metrica-card">Nota TRI <span id="res-tri">0.0</span></div>
                    </div>
                    <button class="btn-acao" onclick="voltarMenuSimulado()">Fazer Novo Simulado</button>
                </div>
            </div>
        </div>

        <!-- ABA 3: PERFIL -->
        <div id="aba-perfil" class="aba-conteudo">
            <div class="card-base">
                <div class="perfil-header">
                    <div class="avatar-container" onclick="document.getElementById('inputFoto').click();">
                        <div class="avatar" id="avatarDiv">M</div>
                        <div class="avatar-overlay">📷</div>
                    </div>
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;" onchange="carregarFoto(event)">
                    <div class="info-usuario">
                        <h2 id="viewNome">miguel_lopes</h2>
                        <input type="text" id="editNome" class="edit-input escondido" value="miguel_lopes">
                        <div class="stats">
                            <div><span>15</span> posts</div>
                            <div><span>420</span> seguidores</div>
                        </div>
                    </div>
                </div>
                <div class="bio">
                    <p><strong>Engenharia Mecânica - UFF ⚙️</strong></p>
                    <p>Foco na constância e aprovação de alto nível.</p>
                </div>
                <button class="btn-acao" id="btnEditar" onclick="alternarEdicao()">Editar Perfil</button>
            </div>
        </div>

    </div>

    <!-- Barra de Navegação Inferior -->
    <div class="barra-inferior">
        <div class="nav-item ativo" onclick="trocarAba('feed', this)">
            <span class="icone">🏠</span>
            <span>Feed</span>
        </div>
        <div class="nav-item" onclick="trocarAba('questoes', this)">
            <span class="icone">⚡</span>
            <span>Simulados</span>
        </div>
        <div class="nav-item" onclick="trocarAba('perfil', this)">
            <span class="icone">👤</span>
            <span>Perfil</span>
        </div>
    </div>

    <script>
        // Troca de Abas Segura
        function trocarAba(nomeAba, elementoNav) {
            document.querySelectorAll('.aba-conteudo').forEach(function(aba) {
                aba.classList.remove('ativa');
            });
            document.getElementById('aba-' + nomeAba).classList.add('ativa');

            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.remove('ativo');
            });
            elementoNav.classList.add('ativo');
        }

        // Banco de Questões
        const bancoMatematica = [
            { enunciado: "Quanto é 30 + 30 * 0 + 10?", alternativas: ["20", "40", "70", "0"], correta: 1 },
            { enunciado: "Se um carro a 60 km/h viaja por 2 horas, qual a distância percorrida?", alternativas: ["60 km", "120 km", "180 km", "240 km"], correta: 1 },
            { enunciado: "Qual a raiz quadrada de 144?", alternativas: ["10", "11", "12", "14"], correta: 2 }
        ];

        let questaoAtual = 0;
        let acertos = 0;
        let erros = 0;
        let tempoRestante = 300;
        let timerId = null;

        function iniciarSimulado() {
            questaoAtual = 0;
            acertos = 0;
            erros = 0;
            tempoRestante = 300;

            document.getElementById('menu-simulado').classList.add('escondido');
            document.getElementById('area-resultado').classList.add('escondido');
            document.getElementById('area-prova').classList.remove('escondido');

            iniciarCronometro();
            mostrarQuestao();
        }

        function iniciarCronometro() {
            clearInterval(timerId);
            timerId = setInterval(function() {
                if (tempoRestante <= 0) {
                    clearInterval(timerId);
                    finalizarSimulado();
                    return;
                }
                tempoRestante--;
                let min = Math.floor(tempoRestante / 60);
                let seg = tempoRestante % 60;
                document.getElementById('relogio').innerText = 
                    (min < 10 ? "0" + min : min) + ":" + (seg < 10 ? "0" + seg : seg);
            }, 1000);
        }

        function mostrarQuestao() {
            let q = bancoMatematica[questaoAtual];
            document.getElementById('progresso-questoes').innerText = "Questão " + (questaoAtual + 1) + " de " + bancoMatematica.length;

            let html = '<div class="badge-dificuldade">ENEM</div>';
            html += '<div class="enunciado">' + q.enunciado + '</div>';
            html += '<div class="alternativas">';

            for (let i = 0; i < q.alternativas.length; i++) {
                let letra = String.fromCharCode(65 + i);
                html += '<button class="alternativa-btn" onclick="responder(' + i + ')">' + letra + ") " + q.alternativas[i] + '</button>';
            }
            html += '</div>';

            document.getElementById('container-questao').innerHTML = html;
        }

        function responder(escolha) {
            let q = bancoMatematica[questaoAtual];
            let botoes = document.querySelectorAll('.alternativa-btn');

            for (let i = 0; i < botoes.length; i++) {
                botoes[i].disabled = true;
                if (i === q.correta) botoes[i].classList.add('correta');
                if (i === escolha && i !== q.correta) botoes[i].classList.add('errada');
            }

            if (escolha === q.correta) {
                acertos++;
            } else {
                erros++;
            }

            setTimeout(function() {
                questaoAtual++;
                if (questaoAtual < bancoMatematica.length) {
                    mostrarQuestao();
                } else {
                    finalizarSimulado();
                }
            }, 1000);
        }

        function finalizarSimulado() {
            clearInterval(timerId);
            document.getElementById('area-prova').classList.add('escondido');
            document.getElementById('area-resultado').classList.remove('escondido');

            document.getElementById('res-acertos').innerText = acertos;
            document.getElementById('res-erros').innerText = erros;

            let notaTri = Math.round(400 + (acertos * 150));
            document.getElementById('res-tri').innerText = notaTri;
        }

        function voltarMenuSimulado() {
            document.getElementById('area-resultado').classList.add('escondido');
            document.getElementById('menu-simulado').classList.remove('escondido');
        }

        // Inicialização Geral
        window.onload = function() {
            if (localStorage.getItem('perfil_nome')) {
                document.getElementById('viewNome').innerText = localStorage.getItem('perfil_nome');
                document.getElementById('editNome').value = localStorage.getItem('perfil_nome');
            }
            if (localStorage.getItem('perfil_foto')) {
                let avatarDiv = document.getElementById('avatarDiv');
                avatarDiv.style.backgroundImage = "url(" + localStorage.getItem('perfil_foto') + ")";
                avatarDiv.innerText = "";
            }
            carregarPosts();
        };

        let editando = false;
        function alternarEdicao() {
            let view = document.getElementById('viewNome');
            let input = document.getElementById('editNome');
            let btn = document.getElementById('btnEditar');

            if (!editando) {
                input.value = view.innerText;
                view.classList.add('escondido');
                input.classList.remove('escondido');
                btn.innerText = "Salvar";
                editando = true;
            } else {
                view.innerText = input.value;
                localStorage.setItem('perfil_nome', input.value);
                input.classList.add('escondido');
                view.classList.remove('escondido');
                btn.innerText = "Editar Perfil";
                editando = false;
            }
        }

        function carregarFoto(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    let base64 = evt.target.result;
                    let avatar = document.getElementById('avatarDiv');
                    avatar.style.backgroundImage = "url(" + base64 + ")";
                    avatar.innerText = "";
                    localStorage.setItem('perfil_foto', base64);
                };
                reader.readAsDataURL(file);
            }
        }

        function criarPost() {
            let txt = document.getElementById('textoPost');
            if (!txt.value.trim()) return alert("Escreva algo!");

            let nome = localStorage.getItem('perfil_nome') || "miguel_lopes";
            let foto = localStorage.getItem('perfil_foto');

            let novo = { autor: nome, conteudo: txt.value, curtidas: 0, foto: foto };
            let posts = JSON.parse(localStorage.getItem('feed_posts')) || [];
            posts.unshift(novo);
            localStorage.setItem('feed_posts', JSON.stringify(posts));

            txt.value = "";
            carregarPosts();
        }

        function carregarPosts() {
            let posts = JSON.parse(localStorage.getItem('feed_posts')) || [];
            let html = `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">M</div>
                        <div class="post-autor">
                            <h4>miguel_lopes</h4>
                            <span>Há 2 horas • UFF</span>
                        </div>
                    </div>
                    <div class="post-conteudo">Foco total na rotina de estudos e simulados hoje! ⚙️🔥</div>
                    <div class="post-acoes"><span onclick="curtir(this)">❤️ Curtir (14)</span></div>
                </div>
            `;

            posts.forEach(function(p) {
                let estilo = p.foto ? "background-image: url(" + p.foto + ");" : "";
                let inicial = p.foto ? "" : p.autor.charAt(0).toUpperCase();
                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar" style="${estilo}">${inicial}</div>
                            <div class="post-autor">
                                <h4>${p.autor}</h4>
                                <span>Agora mesmo</span>
                            </div>
                        </div>
                        <div class="post-conteudo">${p.conteudo}</div>
                        <div class="post-acoes"><span onclick="curtir(this)">❤️ Curtir (${p.curtidas})</span></div>
                    </div>
                `;
            });

            document.getElementById('feedContainer').innerHTML = html;
        }

        function curtir(el) {
            let match = el.innerText.match(/\d+/);
            if (match) el.innerText = "❤️ Curtir (" + (parseInt(match[0]) + 1) + ")";
        }
    </script>

</body>
</html>
