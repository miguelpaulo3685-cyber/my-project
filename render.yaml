services:
  - type: web
    name: enem-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: KEEP_ALIVE_INTERVAL
        value: 5
      - key: CACHE_WARMING_INTERVAL
        value: 60
      - key: DATABASE_URL
        fromDatabase:
          name: enem-db
          property: connectionString
    healthCheckPath: /api/health
    healthCheckInterval: 60

databases:
  - name: enem-db
    databaseName: enem_db
    user: neon_user
    # Usar Neon PostgreSQL (conexão externa)
