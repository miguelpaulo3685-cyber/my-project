name: Manter o servidor acordado

# O plano grátis do Render desliga o servidor depois de 15 minutos sem
# visitas, e a próxima pessoa espera até 1 minuto ele ligar de novo. Este
# robô visita a rota de saúde a cada 10 minutos. Ela responde sem consultar
# o banco, então não gasta a cota do Neon.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/health
        run: |
          # Duas tentativas: acordando, o Render pode levar até 1 minuto.
          for tentativa in 1 2; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://enem-api-cbo6.onrender.com/api/health || echo "000")
            echo "Tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && break
            sleep 20
          done
          # 401 = a versão com o aviso de erros está no ar; 404 = o Render ainda roda uma antiga.
          novo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://enem-api-cbo6.onrender.com/api/admin/erros || echo "000")
          echo "Rota de erros: HTTP $novo"
          # Fora do ar: o robô falha e o GitHub manda e-mail para o dono do repositório.
          if [ "$codigo" != "200" ]; then
            echo "::error::O servidor não respondeu (HTTP $codigo). Confira o Render."
            exit 1
          fi
