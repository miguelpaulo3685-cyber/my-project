<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>M&M Estudos — ENEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* ===================== TEMAS ===================== */
    :root {
      --marca: #6d5efc;
      --marca-forte: #8b7cff;
      --marca-suave: rgba(109, 94, 252, 0.13);
      --certo: #22c55e;
      --errado: #ef4444;
      --aviso: #f59e0b;
      --raio: 16px;
      --sombra: 0 4px 24px rgba(0,0,0,.10);
      /* serifada nos titulos da personalidade; a sans cuida da leitura */
      --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --fonte-titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
    }

    html[data-tema="escuro"] {
      --fundo: #0b0e15;
      --superficie: #141926;
      --superficie-2: #1b2231;
      --borda: #252d3e;
      --texto: #e9ecf4;
      --texto-fraco: #959eb4;
      --sombra-leve: 0 1px 3px rgba(0,0,0,.4);
      --sombra: 0 14px 38px rgba(0,0,0,.55);
      --brilho-topo: rgba(20,25,38,.82);
    }

    html[data-tema="claro"] {
      --fundo: #f2f4f9;
      --superficie: #ffffff;
      --superficie-2: #f7f8fc;
      --borda: #e4e8f1;
      --texto: #141828;
      --texto-fraco: #697189;
      --sombra-leve: 0 1px 2px rgba(20,24,40,.06);
      --sombra: 0 14px 34px rgba(20,24,40,.12);
      --brilho-topo: rgba(255,255,255,.82);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--fonte);
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
      transition: background .25s, color .25s;
      -webkit-font-smoothing: antialiased;
    }

    .marca, h1, h2, .cabeca-questao .ano, .resultado .manchete,
    .cartao-final .valor, .metrica b, .cronometro, .passo {
      font-family: var(--fonte-titulo);
      font-weight: 700;
      letter-spacing: -.01em;
    }

    /* ===================== TOPO ===================== */
    .topo {
      position: sticky; top: 0; z-index: 50;
      background: var(--brilho-topo);
      backdrop-filter: saturate(170%) blur(14px);
      -webkit-backdrop-filter: saturate(170%) blur(14px);
      border-bottom: 1px solid var(--borda);
      padding: 0 20px;
    }
    .topo-interno {
      max-width: 1120px; margin: 0 auto;
      display: flex; align-items: center; gap: 18px;
      min-height: 62px; flex-wrap: wrap;
    }

    .marca {
      font-size: 1.12rem; font-weight: 800; letter-spacing: -.3px;
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .marca .selo {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--marca), var(--marca-forte));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .95rem;
    }
    .marca em { color: var(--marca-forte); font-style: normal; }

    .abas { display: flex; gap: 4px; margin-right: auto; }
    .aba {
      background: transparent; border: none; cursor: pointer;
      color: var(--texto-fraco); font-family: inherit;
      font-size: .93rem; font-weight: 600;
      padding: 9px 15px; border-radius: 10px;
      display: flex; align-items: center; gap: 7px;
      transition: background .18s, color .18s;
    }
    .aba:hover { background: var(--superficie-2); color: var(--texto); }
    .aba.ativa { background: var(--marca-suave); color: var(--marca-forte); }

    .indicadores { display: flex; align-items: center; gap: 14px; }
    .indicador {
      display: flex; align-items: center; gap: 6px;
      font-weight: 700; font-size: .92rem;
    }
    .indicador span { color: var(--texto-fraco); font-weight: 600; font-size: .82rem; }
    .indicador svg { width: 17px; height: 17px; }
    .indicador:first-child svg { color: var(--certo); }
    .indicador:nth-child(2) svg { color: #f0b429; }
    .aba svg { width: 17px; height: 17px; flex-shrink: 0; }

    .btn-icone {
      background: var(--superficie-2); border: 1px solid var(--borda);
      color: var(--texto); cursor: pointer;
      width: 38px; height: 38px; border-radius: 11px;
      font-size: 1.05rem; display: flex; align-items: center; justify-content: center;
      transition: border-color .18s, transform .18s;
    }
    .btn-icone:hover { border-color: var(--marca); transform: translateY(-1px); }

    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--marca), var(--marca-forte));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .95rem; cursor: pointer; border: none;
      font-family: inherit;
    }

    /* ===================== LAYOUT ===================== */
    .pagina { max-width: 1120px; margin: 0 auto; padding: 32px 20px 60px; }
    .escondido { display: none !important; }

    .cabecalho-secao { margin-bottom: 26px; }
    .cabecalho-secao h1 {
      font-size: 1.75rem; font-weight: 800; letter-spacing: -.5px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .cabecalho-secao p { color: var(--texto-fraco); font-size: .95rem; }

    .faixa-status {
      display: flex; align-items: center; gap: 9px;
      background: var(--superficie); border: 1px solid var(--borda);
      border-radius: 12px; padding: 11px 15px; margin-bottom: 24px;
      font-size: .88rem; color: var(--texto-fraco);
    }
    .bolinha { width: 9px; height: 9px; border-radius: 50%; background: var(--texto-fraco); flex-shrink: 0; }
    .bolinha.ok { background: var(--certo); box-shadow: 0 0 0 4px rgba(34,197,94,.16); }
    .bolinha.ruim { background: var(--errado); box-shadow: 0 0 0 4px rgba(239,68,68,.16); }

    /* ===================== CARDS DAS ÁREAS ===================== */
    /* 430px garante no maximo 2 colunas na largura da pagina (1120px),
       deixando os cards largos em vez de espremer tres numa linha */
    .grade-areas {
      display: grid; gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    }

    .area {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: var(--sombra-leve);
      transition: transform .22s cubic-bezier(.2,.8,.3,1), border-color .22s, box-shadow .22s;
    }
    .area:hover {
      transform: translateY(-4px);
      border-color: var(--marca);
      box-shadow: var(--sombra);
    }

    .area-topo {
      padding: 24px 24px 20px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
      flex: 1;
    }
    .area h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.4px; margin-bottom: 7px; }
    .area .sobre { color: var(--texto-fraco); font-size: .89rem; line-height: 1.5; }
    .area .emblema {
      width: 54px; height: 54px; border-radius: 15px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform .25s;
    }
    .area .emblema svg { width: 27px; height: 27px; }
    .area:hover .emblema { transform: scale(1.09) rotate(-4deg); }

    /* progresso da area, logo abaixo do card */
    .barra-area { height: 4px; background: var(--superficie-2); overflow: hidden; }
    .barra-area i { display: block; height: 100%; transition: width .5s ease; }

    .area-rodape {
      border-top: 1px solid var(--borda);
      background: var(--superficie-2);
      padding: 15px 24px;
      display: flex; align-items: center; gap: 22px;
    }
    .metrica { line-height: 1.2; }
    .metrica b { font-size: 1.22rem; font-weight: 800; display: block; }
    .metrica span { font-size: .74rem; color: var(--texto-fraco); text-transform: uppercase; letter-spacing: .5px; }

    button.acao {
      margin-left: auto;
      background: linear-gradient(135deg, var(--marca), var(--marca-forte));
      color: #fff;
      border: none; border-radius: 11px; cursor: pointer;
      padding: 11px 24px; font-size: .92rem; font-weight: 700;
      font-family: inherit; letter-spacing: .01em;
      box-shadow: 0 2px 10px rgba(109,94,252,.3);
      transition: box-shadow .2s, transform .14s, filter .2s;
    }
    button.acao:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(109,94,252,.42); filter: brightness(1.06); }
    button.acao:active { transform: translateY(0); }
    button.acao:disabled { opacity: .55; cursor: default; transform: none; }
    button.acao.secundaria { background: transparent; color: var(--marca-forte); border: 1px solid var(--marca); }
    button.acao.secundaria:hover { background: var(--marca-suave); }
    button.acao.discreta { background: var(--superficie-2); color: var(--texto); border: 1px solid var(--borda); }
    button.acao.pequena { padding: 8px 16px; font-size: .85rem; }

    /* ===================== QUESTÃO ===================== */
      background: var(--marca-suave); color: var(--marca-forte);
      padding: 6px 14px; border-radius: 20px;
      font-size: .8rem; font-weight: 700;
    }

    .painel {
      background: var(--superficie); border: 1px solid var(--borda);
      border-radius: var(--raio); padding: 28px;
    }

    .enunciado {
      line-height: 1.75; font-size: 1.02rem;
      white-space: pre-wrap; word-wrap: break-word;
      margin-bottom: 26px;
    }
    .enunciado img { max-width: 100%; height: auto; border-radius: 10px; margin: 14px 0; }

    /* alternativas grandes, faceis de acertar no toque */
    .alt {
      display: flex; align-items: flex-start; gap: 16px; width: 100%;
      background: var(--superficie-2); color: var(--texto);
      border: 2px solid var(--borda); border-radius: 13px;
      padding: 19px 22px; margin-bottom: 13px;
      font-size: 1rem; line-height: 1.6; text-align: left;
      font-family: inherit; cursor: pointer;
      user-select: none;
      transition: border-color .18s, background .18s, transform .12s;
    }
    .alt:hover:not(:disabled) { border-color: var(--marca); transform: translateX(5px); }
    .alt .letra {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px;
      background: var(--marca); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .95rem;
    }
    .alt.certa { border-color: var(--certo); background: rgba(34,197,94,.13); }
    .alt.certa .letra { background: var(--certo); }
    .alt.errada { border-color: var(--errado); background: rgba(239,68,68,.13); }
    .alt.errada .letra { background: var(--errado); }

    .resultado {
      text-align: center; padding: 28px 20px;
      border-radius: var(--raio); margin: 24px 0;
      animation: surgir .45s cubic-bezier(.2,.9,.3,1.4);
    }
    @keyframes surgir {
      from { opacity: 0; transform: scale(.85) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .resultado .cara { font-size: 3.4rem; display: block; margin-bottom: 10px; }
    .resultado .manchete { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
    .resultado .linha { font-size: 1rem; opacity: .92; }

    .resultado.bom { background: rgba(34,197,94,.14); border: 1px solid rgba(34,197,94,.35); color: var(--certo); }
    .resultado.bom .cara { animation: pular .75s ease infinite alternate; }
    @keyframes pular { from { transform: translateY(0) rotate(-7deg); } to { transform: translateY(-14px) rotate(7deg); } }

    .resultado.mau { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.32); color: var(--errado); }
    .resultado.mau .cara { animation: tremer .5s ease 2; }
    @keyframes tremer { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-13deg)} 75%{transform:rotate(13deg)} }

    .nota-gabarito {
      background: rgba(245,158,11,.11); border-left: 3px solid var(--aviso);
      padding: 16px 18px; border-radius: 10px; margin-bottom: 20px;
      font-size: .92rem; line-height: 1.65;
    }

    /* ===================== BARRA DO BLOCO ===================== */
    .barra-bloco {
      position: sticky; top: 62px; z-index: 40;
      background: var(--superficie); border-bottom: 1px solid var(--borda);
      margin: -32px -20px 24px; padding: 12px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .btn-sair {
      background: var(--superficie-2); border: 1px solid var(--borda);
      color: var(--texto); cursor: pointer; font-family: inherit;
      width: 36px; height: 36px; border-radius: 10px; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-sair:hover { border-color: var(--errado); color: var(--errado); }

    .cronometro {
      font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.05rem;
      min-width: 58px;
    }

    .trilho {
      flex: 1; height: 9px; border-radius: 99px;
      background: var(--superficie-2); overflow: hidden;
      border: 1px solid var(--borda);
    }
    .trilho i { display: block; height: 100%; background: var(--marca); transition: width .35s; }
    .passo { font-weight: 800; font-size: .95rem; white-space: nowrap; }
    .passo span { color: var(--texto-fraco); font-weight: 600; }

    .cabeca-questao {
      margin-bottom: 18px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    }
    .cabeca-questao .ano { font-size: 1.32rem; font-weight: 800; letter-spacing: -.4px; }
    .cabeca-questao .materia { color: var(--marca-forte); font-weight: 700; font-size: .96rem; }

    .nivel {
      flex-shrink: 0; border-radius: 10px; padding: 7px 13px;
      font-size: .8rem; font-weight: 800; line-height: 1.3; text-align: center;
      border: 1px solid transparent; white-space: nowrap;
    }
    .nivel small { display: block; font-size: .68rem; font-weight: 700; opacity: .85; }
    .nivel.n1 { background: rgba(34,197,94,.15);  color: var(--certo);  border-color: rgba(34,197,94,.4); }
    .nivel.n2 { background: rgba(59,130,246,.15); color: #3b82f6;       border-color: rgba(59,130,246,.4); }
    .nivel.n3 { background: rgba(245,158,11,.15); color: var(--aviso);  border-color: rgba(245,158,11,.4); }
    .nivel.n4 { background: rgba(239,68,68,.15);  color: var(--errado); border-color: rgba(239,68,68,.45); }
    .nivel.novo { background: var(--superficie-2); color: var(--texto-fraco); border-color: var(--borda); }

    /* o desafio merece destaque na tela */
    .faixa-desafio {
      display: flex; align-items: center; gap: 11px;
      background: rgba(239,68,68,.11); border: 1px solid rgba(239,68,68,.32);
      border-radius: 12px; padding: 13px 16px; margin-bottom: 18px;
      font-size: .92rem; font-weight: 700; color: var(--errado);
      animation: surgir .4s ease;
    }
    .faixa-desafio span:last-child { font-weight: 600; opacity: .9; }

    .dica-uso {
      display: flex; align-items: flex-start; gap: 11px;
      background: var(--marca-suave); border: 1px solid var(--borda);
      border-radius: 11px; padding: 13px 15px; margin-bottom: 20px;
      font-size: .86rem; line-height: 1.55; color: var(--texto-fraco);
    }
    .dica-uso b { color: var(--texto); }
    .dica-uso button {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: var(--texto-fraco); font-size: 1.1rem; font-family: inherit; line-height: 1;
    }

    /* alternativa eliminada pela pessoa */
    .alt.riscada { opacity: .42; }
    .alt.riscada > span:last-child { text-decoration: line-through; }
    .alt.riscada .letra { background: var(--texto-fraco); }
    .alt.segurando { transform: scale(.985); border-color: var(--aviso); }

    /* ===================== RESULTADO DO BLOCO ===================== */
    .placar-final { text-align: center; padding: 20px 0 10px; }
    .placar-final .simbolo { font-size: 3rem; display: block; margin-bottom: 12px; }
    .placar-final h2 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.5px; margin-bottom: 7px; }
    .placar-final .frase { color: var(--texto-fraco); font-size: 1rem; margin-bottom: 4px; }
    .placar-final .risco { width: 96px; height: 4px; border-radius: 4px; background: var(--marca); margin: 16px auto 30px; }

    .rotulo-acertos {
      text-transform: uppercase; letter-spacing: 3px;
      font-size: .76rem; color: var(--texto-fraco); font-weight: 700; margin-bottom: 14px;
    }
    .estrelas { display: flex; justify-content: center; gap: 12px; margin-bottom: 34px; }
    .estrelas i { font-size: 1.9rem; font-style: normal; opacity: .28; transition: opacity .3s, transform .3s; }
    .estrelas i.acesa { opacity: 1; transform: scale(1.12); }

    .cartoes-final {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px; max-width: 520px; margin: 0 auto 30px;
    }
    .cartao-final {
      background: var(--superficie); border: 1px solid var(--borda);
      border-radius: var(--raio); padding: 22px 18px; text-align: center;
    }
    .cartao-final .icone { font-size: 1.7rem; display: block; margin-bottom: 9px; }
    .cartao-final .valor { font-size: 1.75rem; font-weight: 800; letter-spacing: -1px; }
    .cartao-final .valor small { font-size: .82rem; font-weight: 700; margin-left: 4px; }
    .cartao-final .subiu { color: var(--certo); }
    .cartao-final .desceu { color: var(--errado); }
    .cartao-final .legenda { font-size: .82rem; color: var(--texto-fraco); margin-top: 5px; }

    .botoes-final { max-width: 420px; margin: 0 auto; display: grid; gap: 11px; }
    .botoes-final button { width: 100%; padding: 14px; font-size: 1rem; }

    .rodape-aviso {
      max-width: 560px; margin: 28px auto 0; text-align: center;
      font-size: .8rem; color: var(--texto-fraco); line-height: 1.6;
    }

    /* ===================== CONTA ===================== */
    .form-conta { max-width: 420px; margin: 0 auto; }
    .form-conta label { display: block; font-size: .86rem; font-weight: 700; margin: 18px 0 7px; }
    .form-conta input {
      width: 100%; padding: 13px 15px;
      background: var(--superficie-2); color: var(--texto);
      border: 2px solid var(--borda); border-radius: 11px;
      font-size: .98rem; font-family: inherit;
    }
    .form-conta input:focus { outline: none; border-color: var(--marca); }
    .form-conta button[type=submit] { width: 100%; margin-top: 24px; padding: 14px; font-size: 1rem; }
    .pista { font-size: .79rem; color: var(--texto-fraco); margin-top: 6px; }
    .alternar { text-align: center; margin-top: 20px; font-size: .9rem; color: var(--texto-fraco); }
    .alternar a { color: var(--marca-forte); cursor: pointer; font-weight: 700; }

    .recado { padding: 13px 16px; border-radius: 10px; font-size: .9rem; margin-top: 18px; line-height: 1.5; }
    .recado.ruim { background: rgba(239,68,68,.13); color: var(--errado); }
    .recado.bom { background: rgba(34,197,94,.13); color: var(--certo); }

    /* ===================== FEED ===================== */
    .caixa-texto {
      width: 100%; padding: 15px; min-height: 96px; resize: vertical;
      background: var(--superficie-2); color: var(--texto);
      border: 2px solid var(--borda); border-radius: 12px;
      font-family: inherit; font-size: .97rem; line-height: 1.55;
    }
    .caixa-texto:focus { outline: none; border-color: var(--marca); }

    .post {
      background: var(--superficie); border: 1px solid var(--borda);
      border-radius: 13px; padding: 19px 22px; margin-bottom: 13px;
    }
    .post-autor { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
    .post-autor .bolha {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--marca), var(--marca-forte));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .85rem; flex-shrink: 0;
    }
    .post-autor b { font-size: .94rem; }
    .post p { line-height: 1.65; font-size: .96rem; white-space: pre-wrap; word-wrap: break-word; }

    .onde-salva {
      margin-top: 22px; text-align: center;
      font-size: .85rem; color: var(--texto-fraco); line-height: 1.6;
    }
    .onde-salva a { color: var(--marca-forte); cursor: pointer; font-weight: 700; }

    .vazio { text-align: center; padding: 56px 24px; color: var(--texto-fraco); }
    .vazio .cara { font-size: 2.8rem; display: block; margin-bottom: 14px; }

    /* ===================== CONFETE ===================== */
    #confete { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 999; }
    .papel { position: absolute; width: 11px; height: 17px; opacity: .92; animation: cair linear forwards; }
    @keyframes cair { to { transform: translateY(105vh) rotate(700deg); opacity: 0; } }

    @media (max-width: 700px) {
      .topo-interno { min-height: 56px; gap: 10px; }

    }
  </style>
</head>
<body>
  <div id="confete"></div>

  <!-- ===================== TOPO ===================== -->
  <header class="topo">
    <div class="topo-interno">
      <div class="marca"><span class="selo">M</span>M&amp;M <em>Estudos</em></div>

            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.8A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>

            <path d="M9 11.5 11.5 14 16 8.5"/><circle cx="12" cy="12" r="9.2"/>
          </svg><b id="ind-feitas">0</b>
        </div>
        <div class="indicador" title="Acertos">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="m12 3.2 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/>

  <!-- ===================== FEED ===================== -->

  <!-- ===================== CONTA ===================== -->

    <div class="cabecalho-secao">

    </div>

      <form class="form-conta" id="form-conta" onsubmit="enviarConta(event)">

        <button type="submit" class="acao" id="botao-conta">Entrar</button>
        <div id="recado-conta"></div>

<script>
const API_URL = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? 'http://localhost:3000'
  : 'https://enem-api-cbo6.onrender.com';

// Ícones desenhados em SVG: emoji muda de desenho em cada sistema e
// destoa do resto da interface.
const svg = (miolo) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${miolo}</svg>`;

const AREAS = [
  { id: 'linguagens', nome: 'Linguagens', cor: '#e8893a',
    sobre: 'Língua Portuguesa, Literatura, Estrangeira e Artes.',
    icone: svg('<path d="M12 6.5C12 5 10.5 3.5 7 3.5S2 4.5 2 4.5v13s1.5-1 5-1 5 1.5 5 1.5"/><path d="M12 6.5C12 5 13.5 3.5 17 3.5s5 1 5 1v13s-1.5-1-5-1-5 1.5-5 1.5z"/><path d="M12 6.5v12"/>') },

  { id: 'humanas', nome: 'Ciências Humanas', cor: '#d9568c',
    sobre: 'História, Geografia, Filosofia e Sociologia.',
    icone: svg('<path d="M2.5 9.5 12 3.5l9.5 6"/><path d="M4.5 9.5v9M9.5 9.5v9M14.5 9.5v9M19.5 9.5v9"/><path d="M2.5 18.5h19M3.5 21.5h17"/>') },

  { id: 'natureza', nome: 'Ciências da Natureza', cor: '#17a97a',
    sobre: 'Biologia, Física e Química.',
    icone: svg('<circle cx="12" cy="12" r="2.2"/><ellipse cx="12" cy="12" rx="10" ry="4.4"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(120 12 12)"/>') },

  { id: 'matematica', nome: 'Matemática', cor: '#4a7fe0',
    sobre: 'Matemática e suas tecnologias.',
    icone: svg('<path d="M4 2.8v16.4a1 1 0 0 0 1 1h16.2"/><path d="M7.6 16.2 11 10.8l3.1 2.9 4.6-7.3"/>') }
];

const CHAVE_TOKEN = 'mm_token';
const CHAVE_TEMA = 'mm_tema';
const CHAVE_PROGRESSO = 'mm_progresso';

let usuarioLogado = null;
let modoConta = 'entrar';
let materiaAtual = null;
let questaoAtual = null;
let respondida = false;
let progresso = {};

// ===================== BASE =====================
function escapar(texto) {
  const d = document.createElement('div');
  d.textContent = texto == null ? '' : String(texto);
  return d.innerHTML;
}

function formatarEnunciado(texto) {
  return escapar(texto)
    .replace(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g, '<img src="$1" alt="Imagem da questão" loading="lazy">')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function guardar(chave, valor) {
  try { valor === null ? localStorage.removeItem(chave) : localStorage.setItem(chave, valor); } catch (e) {}
}
function ler(chave) {
  try { return localStorage.getItem(chave); } catch (e) { return null; }
}

// ===================== TEMA =====================
function aplicarTema(tema) {
  document.documentElement.dataset.tema = tema;
  document.getElementById('btn-tema').textContent = tema === 'escuro' ? '🌙' : '☀️';
  guardar(CHAVE_TEMA, tema);
}

function trocarTema() {
  aplicarTema(document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro');
}

function iniciarTema() {
  const salvo = ler(CHAVE_TEMA);
  if (salvo) return aplicarTema(salvo);
  // sem escolha salva, segue a preferência do sistema
  const prefereClaro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  aplicarTema(prefereClaro ? 'claro' : 'escuro');
}

// ===================== NAVEGAÇÃO =====================
function irPara(tela) {
  ['treinar', 'questao', 'resultado', 'feed', 'conta'].forEach(t => {
    document.getElementById('tela-' + t).classList.toggle('escondido', t !== tela);
  });
  const treinando = ['treinar', 'questao', 'resultado'].includes(tela);
  document.getElementById('aba-treinar').classList.toggle('ativa', treinando);
  document.getElementById('aba-feed').classList.toggle('ativa', tela === 'feed');
  if (tela !== 'questao') pararCronometro();
  window.scrollTo(0, 0);
  if (tela === 'treinar') desenharAreas();
  if (tela === 'feed') abrirFeed();
}

// ===================== PROGRESSO =====================
function carregarProgresso() {
  try { progresso = JSON.parse(ler(CHAVE_PROGRESSO)) || {}; } catch (e) { progresso = {}; }
}

function salvarProgresso() {
  // Com conta, quem manda é o servidor: gravar aqui tambem faria o
  // progresso da conta vazar para quem usar o site depois sem entrar.
  if (usuarioLogado) return;
  guardar(CHAVE_PROGRESSO, JSON.stringify(progresso));
}

// Busca no servidor o que a conta ja respondeu, de qualquer aparelho.
async function sincronizarProgresso() {
  if (!usuarioLogado) { carregarProgresso(); desenharTudo(); return; }
  try {
    const r = await fetch(`${API_URL}/api/meu-progresso`, { headers: cabecalhoAuth() });
    if (r.ok) progresso = (await r.json()).progresso || {};
  } catch (e) {
    // sem rede, segue com o que estiver em memoria
  }
  desenharTudo();
}

function desenharTudo() {
  desenharIndicadores();
  desenharAreas();
  desenharOndeSalva();
}

function desenharOndeSalva() {
  const alvo = document.getElementById('onde-salva');
  if (!alvo) return;
  alvo.innerHTML = usuarioLogado
    ? `Seu progresso está salvo na conta <strong>${escapar(usuarioLogado.username)}</strong>
       — continua de onde parou em qualquer aparelho.`
    : `Seu progresso está guardado só neste navegador.
       <a onclick="abrirConta('criar')">Crie uma conta</a> para treinar também no celular.`;
}

function anotarResposta(area, acertou) {
  const p = progresso[area] || { feitas: 0, acertos: 0 };
  p.feitas++;
  if (acertou) p.acertos++;
  progresso[area] = p;
  salvarProgresso();
  desenharIndicadores();
}

function totais() {
  return Object.values(progresso).reduce(
    (t, p) => ({ feitas: t.feitas + p.feitas, acertos: t.acertos + p.acertos }),
    { feitas: 0, acertos: 0 }
  );
}

function desenharIndicadores() {
  const t = totais();
  document.getElementById('ind-feitas').textContent = t.feitas;
  document.getElementById('ind-acertos').textContent = t.acertos;
}

// ===================== ÁREAS =====================
function desenharAreas() {
  document.getElementById('grade-areas').innerHTML = AREAS.map(a => {
    const p = progresso[a.id] || { feitas: 0, acertos: 0 };
    const taxa = p.feitas ? Math.round((p.acertos / p.feitas) * 100) : 0;
    return `
      <article class="area">
        <div class="area-topo">
          <div>
            <h2>${a.nome}</h2>
            <p class="sobre">${a.sobre}</p>
          </div>
          <div class="emblema" style="background:${a.cor}1f;color:${a.cor}">${a.icone}</div>
        </div>
        <div class="barra-area">
          <i style="width:${p.feitas ? taxa : 0}%;background:${a.cor}"></i>
        </div>
        <div class="area-rodape">
          <div class="metrica"><b>${p.feitas}</b><span>Feitas</span></div>
          <div class="metrica"><b>${p.feitas ? taxa + '%' : '—'}</b><span>Acerto</span></div>
          <button class="acao" onclick="abrirMateria('${a.id}')">Treinar</button>
        </div>
      </article>`;
  }).join('');
}

// ===================== QUESTÕES =====================
function nomeDaArea(id) {
  return (AREAS.find(a => a.id === id) || {}).nome || id;
}

const LETRAS = ['A', 'B', 'C', 'D', 'E'];
const POR_BLOCO = 5;

// O nível vem do servidor, calculado pela proporção de acertos de quem já
// respondeu. Questão nova ainda não tem gente suficiente para classificar.
const NIVEIS = {
  1: { classe: 'n1', selo: 'Nv 1', nome: 'Fácil',   ajuda: 'A maioria acerta esta questão.' },
  2: { classe: 'n2', selo: 'Nv 2', nome: 'Médio',   ajuda: 'Cerca de metade acerta.' },
  3: { classe: 'n3', selo: 'Nv 3', nome: 'Difícil', ajuda: 'Poucos acertam esta.' },
  4: { classe: 'n4', selo: 'Nv 4', nome: 'Desafio', ajuda: 'Menos de um quarto acerta.' },
  novo: { classe: 'novo', selo: 'Nova', nome: 'sem nível',
          ajuda: 'Ainda não há respostas suficientes para medir a dificuldade.' }
};

let bloco = null;
let eliminadas = new Set();
let timerCronometro = null;
let mostrouDica = false;

// ---------- cronômetro ----------
function formatarTempo(segundos) {
  const m = Math.floor(segundos / 60);
  const s = segundos % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function iniciarCronometro() {
  pararCronometro();
  timerCronometro = setInterval(() => {
    if (!bloco) return;
    const seg = Math.floor((Date.now() - bloco.inicio) / 1000);
    document.getElementById('cronometro').textContent = formatarTempo(seg);
  }, 1000);
}

function pararCronometro() {
  if (timerCronometro) { clearInterval(timerCronometro); timerCronometro = null; }
}

function atualizarTrilho() {
  const feitas = bloco.respostas.length;
  document.getElementById('trilho-barra').style.width = (feitas / bloco.questoes.length * 100) + '%';
  document.getElementById('passo').innerHTML = `${feitas}<span>/${bloco.questoes.length}</span>`;
}

// ---------- bloco ----------
async function abrirMateria(area) {
  materiaAtual = area;
  irPara('questao');

  const painel = document.getElementById('painel-questao');
  painel.innerHTML = `<div class="vazio"><span class="cara">⏳</span>Montando seu bloco…<br>
    <small>Se o servidor estiver dormindo, pode levar até 1 minuto.</small></div>`;
  document.getElementById('cronometro').textContent = '0:00';
  document.getElementById('trilho-barra').style.width = '0%';
  document.getElementById('passo').innerHTML = `0<span>/${POR_BLOCO}</span>`;

  let questoes = [];
  try {
    const r = await fetch(`${API_URL}/api/questoes/${area}`);
    if (r.status === 404) {
      painel.innerHTML = `<div class="vazio"><span class="cara">📭</span>
        Ainda não há questões de ${escapar(nomeDaArea(area))} no banco.</div>`;
      return;
    }
    if (!r.ok) throw new Error('A API respondeu ' + r.status);
    questoes = (await r.json()).questoes || [];
  } catch (e) {
    painel.innerHTML = `<div class="vazio"><span class="cara">🔌</span>
      Não consegui falar com a API.<br><small>${escapar(e.message)}</small></div>`;
    return;
  }

  if (questoes.length === 0) {
    painel.innerHTML = `<div class="vazio"><span class="cara">📭</span>Nenhuma questão veio da API.</div>`;
    return;
  }

  bloco = { questoes, indice: 0, respostas: [], inicio: Date.now(), inicioQuestao: Date.now() };
  atualizarTrilho();
  iniciarCronometro();
  desenharQuestao();
}

function encerrarBloco() {
  if (bloco && bloco.respostas.length > 0 && bloco.respostas.length < bloco.questoes.length) {
    if (!confirm('Sair agora encerra o bloco. Tem certeza?')) return;
  }
  pararCronometro();
  bloco = null;
  irPara('treinar');
}

function proximaQuestao() {
  bloco.indice++;
  if (bloco.indice >= bloco.questoes.length) return mostrarResultado();
  bloco.inicioQuestao = Date.now();
  desenharQuestao();
}

function desenharQuestao() {
  const q = bloco.questoes[bloco.indice];
  questaoAtual = q;
  respondida = false;
  eliminadas = new Set();

  const alternativas = typeof q.alternativas === 'string' ? JSON.parse(q.alternativas) : (q.alternativas || []);

  // só na primeira questão do bloco, e nunca mais depois de fechada
  const dica = (mostrouDica || bloco.indice > 0) ? '' : `
    <div class="dica-uso" id="dica-uso">
      <span>💡</span>
      <span><b>Dica:</b> segure o clique numa alternativa (ou clique com o botão direito)
      para riscá-la e ir eliminando as que você descartou.</span>
      <button onclick="fecharDica()" title="Fechar">✕</button>
    </div>`;

  const n = NIVEIS[q.nivel] || NIVEIS.novo;
  const desafio = q.nivel === 4 ? `
    <div class="faixa-desafio">
      <span>🔥</span>
      <span>Questão desafio — pouca gente acerta esta. Capricha!</span>
    </div>` : '';

  document.getElementById('painel-questao').innerHTML = `
    <div class="cabeca-questao">
      <div>
        <div class="ano">ENEM ${escapar(q.ano)}</div>
        <div class="materia">${escapar(nomeDaArea(materiaAtual))}</div>
      </div>
      <span class="nivel ${n.classe}" title="${escapar(n.ajuda)}">
        ${n.selo}<small>${n.nome}</small>
      </span>
    </div>
    ${desafio}
    ${dica}
    <div class="enunciado">${formatarEnunciado(q.contexto)}</div>
    <div id="lista-alts">${alternativas.map((t, i) => `
      <button class="alt" id="alt-${i}"
        onmousedown="pressionar(event, ${i})" onmouseup="soltar(event, ${i})"
        onmouseleave="cancelarPressao()" oncontextmenu="return riscarPeloMenu(event, ${i})"
        ontouchstart="pressionar(event, ${i})" ontouchend="soltar(event, ${i})"
        ontouchcancel="cancelarPressao()">
        <span class="letra">${LETRAS[i] || i + 1}</span>
        <span>${escapar(t)}</span>
      </button>`).join('')}</div>
    <div id="area-resultado"></div>`;

  bloco.inicioQuestao = Date.now();
}

function fecharDica() {
  mostrouDica = true;
  document.getElementById('dica-uso')?.remove();
}

// ---------- eliminar alternativas ----------
let timerPressao = null;
let riscouAgora = false;

function pressionar(evento, i) {
  if (respondida) return;
  if (evento.button === 2) return; // botão direito tem tratamento próprio
  riscouAgora = false;
  document.getElementById('alt-' + i)?.classList.add('segurando');
  timerPressao = setTimeout(() => {
    riscouAgora = true;
    alternarRiscada(i);
    if (navigator.vibrate) navigator.vibrate(35);
  }, 450);
}

function soltar(evento, i) {
  cancelarPressao();
  if (respondida) return;
  // o botao direito so risca, pelo oncontextmenu; sem isso o mouseup dele
  // cairia aqui e responderia a questao sem querer
  if (evento.button === 2) return;
  // um toque curto responde; se já virou risco, não conta como resposta
  if (riscouAgora) { riscouAgora = false; return; }
  if (eliminadas.has(i)) { alternarRiscada(i); return; } // clique em riscada desfaz
  responder(i);
}

function cancelarPressao() {
  if (timerPressao) { clearTimeout(timerPressao); timerPressao = null; }
  document.querySelectorAll('.alt.segurando').forEach(e => e.classList.remove('segurando'));
}

function riscarPeloMenu(evento, i) {
  evento.preventDefault();
  if (!respondida) alternarRiscada(i);
  return false;
}

function alternarRiscada(i) {
  const alvo = document.getElementById('alt-' + i);
  if (!alvo) return;
  if (eliminadas.has(i)) { eliminadas.delete(i); alvo.classList.remove('riscada'); }
  else { eliminadas.add(i); alvo.classList.add('riscada'); }
}

// ---------- responder ----------
function responder(escolhida) {
  if (respondida) return;
  respondida = true;
  cancelarPressao();

  const q = bloco.questoes[bloco.indice];
  const acertou = escolhida === q.correta;
  const segundos = Math.max(1, Math.round((Date.now() - bloco.inicioQuestao) / 1000));

  bloco.respostas.push({ acertou, segundos });
  anotarResposta(materiaAtual, acertou);
  atualizarTrilho();
  if (acertou) soltarConfete();
  registrarResposta(q.id, acertou, segundos);

  document.querySelectorAll('.alt').forEach(b => b.disabled = true);
  document.getElementById('alt-' + q.correta)?.classList.add('certa');
  if (!acertou) document.getElementById('alt-' + escolhida)?.classList.add('errada');

  const letra = LETRAS[q.correta] || (q.correta + 1);
  const r = acertou
    ? { classe: 'bom', cara: '🎉', manchete: 'Acertou!', linha: 'Parabéns, mandou muito bem!' }
    : { classe: 'mau', cara: '💪', manchete: 'Errou, que pena!', linha: 'Continue tentando, você chega lá!' };

  const ultima = bloco.indice === bloco.questoes.length - 1;

  document.getElementById('area-resultado').innerHTML = `
    <div class="resultado ${r.classe}">
      <span class="cara">${r.cara}</span>
      <div class="manchete">${r.manchete}</div>
      <div class="linha">${r.linha}</div>
    </div>
    <div class="nota-gabarito">
      <strong>Resposta correta: alternativa ${letra}</strong> — destacada em verde.<br>
      A explicação de cada alternativa ainda não está disponível: a fonte das questões
      fornece o gabarito, mas não a justificativa.
    </div>
    <button class="acao" onclick="proximaQuestao()">
      ${ultima ? 'Ver resultado →' : 'Próxima questão →'}
    </button>`;

  document.getElementById('area-resultado').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Manda a resposta para o servidor, que usa o conjunto de todas para medir a
// dificuldade. Falhar aqui não pode atrapalhar quem está estudando, então o
// erro só vai para o console.
function registrarResposta(questaoId, acertou, segundos) {
  if (!Number.isInteger(questaoId)) return;
  fetch(`${API_URL}/api/responder`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...cabecalhoAuth() },
    body: JSON.stringify({ questao_id: questaoId, acertou, segundos })
  }).catch(e => console.warn('Não registrei a resposta:', e.message));
}

// ---------- resultado do bloco ----------
function mostrarResultado() {
  pararCronometro();

  const total = bloco.respostas.length;
  const acertos = bloco.respostas.filter(r => r.acertou).length;
  const segundos = bloco.respostas.reduce((s, r) => s + r.segundos, 0);
  const media = total ? Math.round(segundos / total) : 0;
  const percentual = total ? Math.round(acertos / total * 100) : 0;
  const nome = usuarioLogado ? usuarioLogado.username : null;

  let simbolo, titulo, frase;
  if (percentual >= 80) {
    simbolo = '🏆';
    titulo = nome ? `Mandou bem, ${nome}!` : 'Mandou bem!';
    frase = 'Esse é o caminho — continue assim!';
  } else if (percentual >= 40) {
    simbolo = '📈';
    titulo = nome ? `Bom trabalho, ${nome}!` : 'Bom trabalho!';
    frase = 'Você está evoluindo. Mais um bloco?';
  } else {
    simbolo = '📊';
    titulo = nome ? `Não desanime, ${nome}!` : 'Não desanime!';
    frase = 'A prática leva à perfeição!';
  }

  document.getElementById('res-simbolo').textContent = simbolo;
  document.getElementById('res-titulo').textContent = titulo;
  document.getElementById('res-frase').textContent = frase;

  document.getElementById('res-estrelas').innerHTML =
    Array.from({ length: bloco.questoes.length }, (_, i) =>
      `<i class="${i < acertos ? 'acesa' : ''}">${i < acertos ? '⭐' : '☆'}</i>`).join('');

  document.getElementById('res-nota').innerHTML =
    `${percentual}%<small class="${percentual >= 50 ? 'subiu' : 'desceu'}">${acertos}/${total}</small>`;
  document.getElementById('res-tempo').textContent = formatarTempo(media);

  document.getElementById('res-aviso').textContent =
    'O aproveitamento é a conta simples de acertos sobre questões. Não é a nota do TRI, ' +
    'que depende de parâmetros estatísticos de cada questão que a fonte não fornece.';

  irPara('resultado');
}

function soltarConfete() {
  const cores = ['#6d5efc', '#8b7cff', '#22c55e', '#f59e0b', '#ec4899', '#3b82f6'];
  const palco = document.getElementById('confete');
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'papel';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = '-20px';
    p.style.background = cores[Math.floor(Math.random() * cores.length)];
    p.style.animationDuration = (2 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * .4) + 's';
    palco.appendChild(p);
    setTimeout(() => p.remove(), 4200);
  }
}

// ===================== CONTA =====================
function cabecalhoAuth() {
  const t = ler(CHAVE_TOKEN);
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

function desenharPerfil() {
  const botao = document.getElementById('btn-perfil');
  if (usuarioLogado) {
    botao.textContent = (usuarioLogado.username || '?').trim().charAt(0).toUpperCase();
    botao.title = usuarioLogado.username + ' — clique para sair';
  } else {
    botao.textContent = '?';
    botao.title = 'Entrar ou criar conta';
  }
}

function cliqueNoPerfil() {
  if (usuarioLogado) {
    if (confirm(`Sair da conta de ${usuarioLogado.username}?`)) sair();
  } else {
    abrirConta('entrar');
  }
}

function abrirConta(modo) {
  modoConta = modo;
  const criando = modo === 'criar';

  document.getElementById('titulo-conta').textContent = criando ? 'Criar conta' : 'Entrar';
  document.getElementById('sub-conta').textContent = criando
    ? 'Leva menos de um minuto.' : 'Bom te ver de novo.';
  document.getElementById('campo-nome').classList.toggle('escondido', !criando);
  document.getElementById('conta-nome').required = criando;
  document.getElementById('botao-conta').textContent = criando ? 'Criar minha conta' : 'Entrar';
  document.getElementById('conta-senha').autocomplete = criando ? 'new-password' : 'current-password';
  document.getElementById('pista-senha').textContent = criando ? 'Ao menos 8 caracteres, com letras e números.' : '';
  document.getElementById('pista-email').textContent = criando ? 'Conferimos se o domínio existe de verdade.' : '';
  document.getElementById('recado-conta').innerHTML = '';
  document.getElementById('form-conta').reset();
  document.getElementById('alternar-conta').innerHTML = criando
    ? `Já tem conta? <a onclick="abrirConta('entrar')">Entrar</a>`
    : `Ainda não tem conta? <a onclick="abrirConta('criar')">Criar agora</a>`;

  irPara('conta');
}

function recadoConta(texto, tipo) {
  document.getElementById('recado-conta').innerHTML = `<div class="recado ${tipo}">${escapar(texto)}</div>`;
}

async function enviarConta(evento) {
  evento.preventDefault();
  const botao = document.getElementById('botao-conta');
  const criando = modoConta === 'criar';

  const corpo = {
    email: document.getElementById('conta-email').value.trim(),
    senha: document.getElementById('conta-senha').value
  };
  if (criando) corpo.nome = document.getElementById('conta-nome').value.trim();

  botao.disabled = true;
  botao.textContent = criando ? 'Criando…' : 'Entrando…';

  try {
    const r = await fetch(`${API_URL}/api/auth/${criando ? 'registrar' : 'login'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    });
    const dados = await r.json();

    if (!r.ok) { recadoConta(dados.error || 'Não deu certo.', 'ruim'); return; }

    guardar(CHAVE_TOKEN, dados.token);
    usuarioLogado = dados.usuario;
    desenharPerfil();
    await sincronizarProgresso();
    recadoConta(criando ? 'Conta criada! Bem-vindo.' : 'Bem-vindo de volta!', 'bom');
    setTimeout(() => irPara('treinar'), 700);
  } catch (e) {
    recadoConta('Não consegui falar com o servidor: ' + e.message, 'ruim');
  } finally {
    botao.disabled = false;
    botao.textContent = criando ? 'Criar minha conta' : 'Entrar';
  }
}

async function sair() {
  try { await fetch(`${API_URL}/api/auth/sair`, { method: 'POST', headers: cabecalhoAuth() }); } catch (e) {}
  guardar(CHAVE_TOKEN, null);
  usuarioLogado = null;
  desenharPerfil();
  carregarProgresso(); // volta ao progresso de quem usa sem conta
  desenharTudo();
  irPara('treinar');
}

async function restaurarSessao() {
  if (!ler(CHAVE_TOKEN)) { desenharPerfil(); return; }
  try {
    const r = await fetch(`${API_URL}/api/auth/eu`, { headers: cabecalhoAuth() });
    if (r.ok) usuarioLogado = (await r.json()).usuario;
    else guardar(CHAVE_TOKEN, null);
  } catch (e) {}
  desenharPerfil();
  await sincronizarProgresso();
}

// ===================== FEED =====================
async function publicar() {
  const caixa = document.getElementById('texto-post');
  const conteudo = caixa.value.trim();
  if (!conteudo) return;

  const botao = document.getElementById('botao-publicar');
  botao.disabled = true;
  botao.textContent = 'Publicando…';

  try {
    const r = await fetch(`${API_URL}/api/posts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...cabecalhoAuth() },
      body: JSON.stringify({ conteudo })
    });
    if (r.ok) { caixa.value = ''; await abrirFeed(); return; }
    alert((await r.json()).error || 'Não consegui publicar.');
  } catch (e) {
    alert('Não consegui publicar: ' + e.message);
  } finally {
    botao.disabled = false;
    botao.textContent = 'Publicar';
  }
}

async function abrirFeed() {
  document.getElementById('area-publicar').innerHTML = usuarioLogado
    ? `<div class="painel" style="margin-bottom:22px">
         <textarea class="caixa-texto" id="texto-post" maxlength="2000"
           placeholder="Compartilhe uma dica, tire uma dúvida, explique uma questão…"></textarea>
         <button class="acao" id="botao-publicar" onclick="publicar()" style="margin-top:14px">Publicar</button>
       </div>`
    : `<div class="painel" style="margin-bottom:22px;text-align:center">
         <p style="color:var(--texto-fraco);margin-bottom:14px">Entre na sua conta para escrever no feed.</p>
         <button class="acao" onclick="abrirConta('entrar')">Entrar</button>
       </div>`;

  const alvo = document.getElementById('lista-posts');
  alvo.innerHTML = '<div class="vazio"><span class="cara">⏳</span>Carregando…</div>';

  try {
    const posts = (await (await fetch(`${API_URL}/api/posts`)).json()).posts || [];
    alvo.innerHTML = posts.length === 0
      ? '<div class="vazio"><span class="cara">💬</span>Nenhum post ainda. Seja o primeiro!</div>'
      : posts.map(p => `
          <article class="post">
            <div class="post-autor">
              <span class="bolha">${escapar((p.usuario_id || '?').charAt(0).toUpperCase())}</span>
              <b>${escapar(p.usuario_id)}</b>
            </div>
            <p>${escapar(p.conteudo)}</p>
          </article>`).join('');
  } catch (e) {
    alvo.innerHTML = `<div class="vazio"><span class="cara">🔌</span>Não consegui carregar os posts.<br>
      <small>${escapar(e.message)}</small></div>`;
  }
}

// ===================== STATUS =====================
function verificarAPI() {
  const bolinha = document.getElementById('bolinha');
  const texto = document.getElementById('texto-status');
  fetch(`${API_URL}/api/health`)
    .then(r => r.json())
    .then(d => {
      const ok = d.banco === 'conectado';
      bolinha.className = 'bolinha ' + (ok ? 'ok' : 'ruim');
      texto.textContent = ok
        ? 'Tudo funcionando — 2684 questões disponíveis'
        : 'Servidor no ar, mas sem conexão com o banco';
    })
    .catch(e => {
      bolinha.className = 'bolinha ruim';
      texto.textContent = 'Sem conexão com a API: ' + e.message;
    });
}

// ===================== INÍCIO =====================
iniciarTema();
carregarProgresso();
desenharTudo();
// restaurarSessao troca o progresso pelo da conta, se houver sessao valida
window.addEventListener('load', () => { verificarAPI(); restaurarSessao(); });
</script>
